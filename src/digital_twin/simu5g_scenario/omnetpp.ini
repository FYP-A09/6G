# ========================================
# HANDOVER - NR ONLY (No LTE)
# ========================================
# ENABLE NR handover
**.cellularNic.nrPhy.enableHandover = true
**.ue[*].cellularNic.nrPhy.handoverLatency = 0.05s
**.ue[*].cellularNic.nrPhy.handoverDelta = 3dB

# ========================================
# BUFFERS
# ========================================
**.mac.queueSize = 2MB
**.cellularNic.nrRlc.um.bufferSize = 2MB
**.cellularNic.nrRlc.am.bufferSize = 2MB

# ========================================
# SCHEDULING
# ========================================
**.mac.schedulingDisciplineDl = "PF"
**.mac.schedulingDisciplineUl = "PF"
**.rbAllocationType = "localized"

# ========================================
# UPLINK TRAFFIC (UE → Server)
# ========================================
**.server.numApps = 10
**.server.app[*].typename = "CbrReceiver"
**.server.app[*].localPort = 5000 + ancestorIndex(0)

**.ue[*].numApps = 1
**.ue[*].app[0].typename = "CbrSender"
**.ue[*].app[0].destAddress = "server"
**.ue[*].app[0].destPort = 5000 + ancestorIndex(1)
**.ue[*].app[0].localPort = 3000 + ancestorIndex(1)
**.ue[*].app[0].packetSize = 12500B
**.ue[*].app[0].sampling_time = 0.001s


# ========================================
# RECORDING - Start with minimal, enable selectively
# ========================================
**.vector-recording = true
**.scalar-recording = true
# ========================================
# OUTPUT FILES
# ========================================
output-vector-file = "${resultdir}/${configname}-${runnumber}.vec"
output-scalar-file = "${resultdir}/${configname}-${runnumber}.sca"
# ========================================
# MOBILITY & POSITION TRACKING
# ========================================
**.ue[*].mobility.*.vector-recording = true

# ========================================
# HANDOVER METRICS
# ========================================
**.ue[*].cellularNic.nrPhy.servingCell:vector = true
