**.componentCarrier[0].numerologyIndex = 3
**.componentCarrier[0].carrierFrequency = 4GHz
**.componentCarrier[0].numRbs = 66

# ========================================
# CORE NETWORK - 5G Standalone Architecture
# ========================================
