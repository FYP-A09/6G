# Load sweep for validating the unified environment's latency model against Simu5G.
#
# One NR gNodeB (SingleCell_Standalone, 50 RBs) serves 10 stationary UEs with downlink UDP traffic. The offered load
# per UE is swept; the receiver records the end-to-end delay of every packet. Copy next to omnetpp.ini of
# simulations/nr/standalone and run with: simu5g -u Cmdenv -f loadsweep.ini -c LoadSweep -r 0 --sim-time-limit=8s
# with the send interval overridden per point by src/unified/simu5g_sweep.py.
[General]
abstract = true
**.routingRecorder.enabled = false
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
seed-set = ${repetition}
**.vector-recording = true
**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false
**.numBands = 50
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
**.targetBler = 0.01
**.blerShift = 5
*.configurator.config = xmldoc("./demo.xml")

[Config LoadSweep]
network = simu5g.simulations.nr.networks.SingleCell_Standalone
sim-time-limit = 8s
*.gnb.mobility.initialX = 450m
*.gnb.mobility.initialY = 300m
*.numUe = 10
*.ue[*].mobility.initialX = uniform(400m, 500m)
*.ue[*].mobility.initialY = uniform(330m, 420m)
*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 1
*.ue[*].numApps = 1
*.server.numApps = 10
*.ue[*].app[0].typename = "UdpSink"
*.ue[*].app[0].localPort = 4000
*.server.app[*].typename = "UdpBasicApp"
*.server.app[*].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[*].destPort = 4000
*.server.app[*].localPort = 5000 + ancestorIndex(0)
*.server.app[*].messageLength = 1000B
*.server.app[*].startTime = uniform(0.2s, 0.25s)
*.server.app[*].sendInterval = 0.01s   # overridden per sweep point on the command line
