**.ue[*].cellularNic.nrPhy.handoverLatency:vector = true
**.ue[*].cellularNic.mac.handoverInitiated:vector = true
**.ue[*].cellularNic.mac.handoverCompleted:vector = true

# ========================================
# CHANNEL QUALITY INDICATORS
# ========================================
**.ue[*].cellularNic.nrPhy.averageCqiDl:vector = true
**.ue[*].cellularNic.nrPhy.averageCqiUl:vector = true
**.ue[*].cellularNic.nrPhy.ueSinr:vector = true

# ========================================
# THROUGHPUT METRICS - Application Layer
# ========================================
**.ue[*].app[*].cbrGeneratedThroughput:vector = true
**.ue[*].app[*].cbrReceivedThroughput:vector = true
**.ue[*].app[*].cbrGeneratedBytes:vector = true
**.ue[*].app[*].cbrReceivedBytes:vector = true
**.ue[*].app[*].cbrSentPkt:vector = true
**.ue[*].app[*].cbrReceivedPkt:vector = true

# Server side application metrics
**.server.app[*].cbrReceivedThroughput:vector = true
**.server.app[*].cbrReceivedBytes:vector = true
**.server.app[*].cbrReceivedPkt:vector = true
**.server.app[*].throughput:vector = true

# ========================================
# LATENCY METRICS
# ========================================
**.ue[*].app[*].endToEndDelay:vector = true
**.ue[*].app[*].cbrFrameDelay:vector = true
**.server.app[*].endToEndDelay:vector = true
**.server.app[*].cbrFrameDelay:vector = true

# ========================================
# THROUGHPUT METRICS - MAC Layer
# ========================================
**.ue[*].cellularNic.mac.macThroughputUl:vector = true
**.ue[*].cellularNic.mac.macThroughputDl:vector = true
**.ue[*].cellularNic.mac.macDelayUl:vector = true
**.ue[*].cellularNic.mac.macDelayDl:vector = true

# ========================================
# BUFFER OCCUPANCY (congestion indicators)
# ========================================
**.ue[*].cellularNic.mac.macBufferOccupancyUl:vector = true
**.ue[*].cellularNic.mac.macBufferOccupancyDl:vector = true
**.ue[*].cellularNic.mac.macBufferSize:vector = true

# ========================================
# RLC LAYER METRICS
# ========================================
**.ue[*].cellularNic.nrRlc.*.rlcThroughputUl:vector = true
**.ue[*].cellularNic.nrRlc.*.rlcThroughputDl:vector = true
**.ue[*].cellularNic.nrRlc.*.rlcDelayUl:vector = true
**.ue[*].cellularNic.nrRlc.*.rlcDelayDl:vector = true
**.ue[*].cellularNic.nrRlc.*.rlcPduLoss:vector = true

# ========================================
# PDCP LAYER METRICS
# ========================================
**.ue[*].cellularNic.pdcp.*.pdcpThroughputUl:vector = true
**.ue[*].cellularNic.pdcp.*.pdcpThroughputDl:vector = true
**.ue[*].cellularNic.pdcp.*.pdcpDelayUl:vector = true
**.ue[*].cellularNic.pdcp.*.pdcpDelayDl:vector = true

# ========================================
# PACKET LOSS & RETRANSMISSIONS
# ========================================
**.ue[*].cellularNic.mac.macPduLoss:vector = true
**.ue[*].cellularNic.mac.harqErrorRate:vector = true
**.ue[*].cellularNic.mac.harqTxAttempts:vector = true

# ========================================
