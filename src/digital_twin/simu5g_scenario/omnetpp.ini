# ========================================
# HANDOVER - NR ONLY (No LTE)
# ========================================
# ENABLE NR handover
**.cellularNic.nrPhy.enableHandover = true
**.ue[*].cellularNic.nrPhy.handoverLatency = 0.05s
**.ue[*].cellularNic.nrPhy.handoverDelta = 3dB

# ========================================
# BUFFERS
# ========================================
**.mac.queueSize = 2MB
**.cellularNic.nrRlc.um.bufferSize = 2MB
**.cellularNic.nrRlc.am.bufferSize = 2MB

# ========================================
# SCHEDULING
# ========================================
**.mac.schedulingDisciplineDl = "PF"
**.mac.schedulingDisciplineUl = "PF"
**.rbAllocationType = "localized"

# ========================================
# UPLINK TRAFFIC (UE → Server)
# ========================================
**.server.numApps = 10
**.server.app[*].typename = "CbrReceiver"
**.server.app[*].localPort = 5000 + ancestorIndex(0)

**.ue[*].numApps = 1
**.ue[*].app[0].typename = "CbrSender"
**.ue[*].app[0].destAddress = "server"
**.ue[*].app[0].destPort = 5000 + ancestorIndex(1)
**.ue[*].app[0].localPort = 3000 + ancestorIndex(1)
**.ue[*].app[0].packetSize = 12500B
**.ue[*].app[0].sampling_time = 0.001s


# ========================================
# RECORDING - Start with minimal, enable selectively
# ========================================
**.vector-recording = true
**.scalar-recording = true
# ========================================
# OUTPUT FILES
# ========================================
output-vector-file = "${resultdir}/${configname}-${runnumber}.vec"
output-scalar-file = "${resultdir}/${configname}-${runnumber}.sca"
# ========================================
# MOBILITY & POSITION TRACKING
# ========================================
**.ue[*].mobility.*.vector-recording = true

# ========================================
# HANDOVER METRICS
# ========================================
**.ue[*].cellularNic.nrPhy.servingCell:vector = true
**.ue[*].cellularNic.nrPhy.measuredRsrp:vector = true
**.ue[*].cellularNic.nrPhy.measuredRsrq:vector = true
**.ue[*].cellularNic.mac.macCellId:vector = true
**.ue[*].cellularNic.nrPhy.handoverLatency:vector = true
**.ue[*].cellularNic.mac.handoverInitiated:vector = true
**.ue[*].cellularNic.mac.handoverCompleted:vector = true

# ========================================
# CHANNEL QUALITY INDICATORS
# ========================================
**.ue[*].cellularNic.nrPhy.averageCqiDl:vector = true
**.ue[*].cellularNic.nrPhy.averageCqiUl:vector = true
**.ue[*].cellularNic.nrPhy.ueSinr:vector = true

# ========================================
# THROUGHPUT METRICS - Application Layer
# ========================================
**.ue[*].app[*].cbrGeneratedThroughput:vector = true
**.ue[*].app[*].cbrReceivedThroughput:vector = true
**.ue[*].app[*].cbrGeneratedBytes:vector = true
**.ue[*].app[*].cbrReceivedBytes:vector = true
**.ue[*].app[*].cbrSentPkt:vector = true
**.ue[*].app[*].cbrReceivedPkt:vector = true

# Server side application metrics
**.server.app[*].cbrReceivedThroughput:vector = true
**.server.app[*].cbrReceivedBytes:vector = true
**.server.app[*].cbrReceivedPkt:vector = true
**.server.app[*].throughput:vector = true

# ========================================
# LATENCY METRICS
# ========================================
**.ue[*].app[*].endToEndDelay:vector = true
**.ue[*].app[*].cbrFrameDelay:vector = true
**.server.app[*].endToEndDelay:vector = true
**.server.app[*].cbrFrameDelay:vector = true

# ========================================
# THROUGHPUT METRICS - MAC Layer
# ========================================
**.ue[*].cellularNic.mac.macThroughputUl:vector = true
**.ue[*].cellularNic.mac.macThroughputDl:vector = true
**.ue[*].cellularNic.mac.macDelayUl:vector = true
**.ue[*].cellularNic.mac.macDelayDl:vector = true

# ========================================
# BUFFER OCCUPANCY (congestion indicators)
# ========================================
**.ue[*].cellularNic.mac.macBufferOccupancyUl:vector = true
**.ue[*].cellularNic.mac.macBufferOccupancyDl:vector = true
**.ue[*].cellularNic.mac.macBufferSize:vector = true

# ========================================
# RLC LAYER METRICS
# ========================================
**.ue[*].cellularNic.nrRlc.*.rlcThroughputUl:vector = true
**.ue[*].cellularNic.nrRlc.*.rlcThroughputDl:vector = true
**.ue[*].cellularNic.nrRlc.*.rlcDelayUl:vector = true
**.ue[*].cellularNic.nrRlc.*.rlcDelayDl:vector = true
**.ue[*].cellularNic.nrRlc.*.rlcPduLoss:vector = true

# ========================================
# PDCP LAYER METRICS
# ========================================
**.ue[*].cellularNic.pdcp.*.pdcpThroughputUl:vector = true
**.ue[*].cellularNic.pdcp.*.pdcpThroughputDl:vector = true
**.ue[*].cellularNic.pdcp.*.pdcpDelayUl:vector = true
**.ue[*].cellularNic.pdcp.*.pdcpDelayDl:vector = true

# ========================================
# PACKET LOSS & RETRANSMISSIONS
# ========================================
**.ue[*].cellularNic.mac.macPduLoss:vector = true
**.ue[*].cellularNic.mac.harqErrorRate:vector = true
**.ue[*].cellularNic.mac.harqTxAttempts:vector = true

# ========================================
# RESOURCE ALLOCATION
# ========================================
**.ue[*].cellularNic.mac.allocatedRbsUl:vector = true
**.ue[*].cellularNic.mac.allocatedRbsDl:vector = true
**.ue[*].cellularNic.mac.schedulingGrant:vector = true





# ===================================================================================================================
# ===================================================================================================================
# ===================================================================================================================

[Config SUMO_Integrator_Realistic_1106]
description = "5G NR Standalone - Nevers town multi-cell deployment with SUMO UEs third split continuation"
network = simu5g.simulations.NR.networks.MultiCell_X2Mesh_19gNodeB_NR



sim-time-limit = 5s
*.numUe = 80

# ========================================
# CHANNEL CONTROL
# ========================================
**.channelControl.pMax = 10W
**.channelControl.sat = -110dBm
**.channelControl.alpha = 1.0

# ========================================
# CHANNEL MODEL - NR Specific
# ========================================
# Apply to ALL nodes
**.channelModel.typename = "NRChannelModel"
**.channelModel.scenario = "URBAN_MACROCELL"
**.channelModel.enableDistanceValidation = false

# Enable fading for NR PHY
**.cellularNic.nrPhy.enableFading = true

# ========================================
