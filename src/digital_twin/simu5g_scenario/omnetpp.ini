# NeversNet5G release configuration
#
# This omnetpp.ini copy has been trimmed for dataset publication. It keeps only
# the configuration blocks used to generate the released NeversNet5G scenario
# parts and transition windows. Generic Simu5G example configs and broken test
# configs from the development workspace were intentionally omitted.
#
# Kept configs:
# - SUMO_Integrator_Realistic_part_1
# - SUMO_Integrator_Realistic_part_2
# - SUMO_Integrator_Realistic_part_3
# - SUMO_Integrator_Realistic_part_4
# - SUMO_Integrator_Realistic_366
# - SUMO_Integrator_Realistic_736
# - SUMO_Integrator_Realistic_1106

[General]
image-path=../../images
#tkenv-plugin-path = ../../../inet/etc/plugins
output-scalar-file-append = false
sim-time-limit=20s

############### Statistics ##################
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
seed-set = ${repetition}
**.vector-recording = false

################ Mobility parameters #####################
# *
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = true

############### Number of Resource Blocks ################
**.numBands = 6 # this value should be kept equal to the number of RBs

############### Transmission Power ##################
**.ueTxPower = 26
**.eNodeBTxPower = 40

############### IPv4 configurator config #################
*.configurator.config = xmldoc("./demo.xml")

[Config SUMO_Integrator_Realistic_part_1]
description = "5G NR Standalone - Nevers town multi-cell deployment with SUMO UEs first split"
network = simu5g.simulations.NR.networks.MultiCell_X2Mesh_19gNodeB_NR



sim-time-limit = 366s
*.numUe = 119

# ========================================
# CHANNEL CONTROL
# ========================================
**.channelControl.pMax = 10W
**.channelControl.sat = -110dBm
**.channelControl.alpha = 1.0

# ========================================
# CHANNEL MODEL - NR Specific
# ========================================
# Apply to ALL nodes
**.channelModel.typename = "NRChannelModel"
**.channelModel.scenario = "URBAN_MACROCELL"
**.channelModel.enableDistanceValidation = false

# Enable fading for NR PHY
**.cellularNic.nrPhy.enableFading = true

# ========================================
# CONSTRAINT AREA - 3D positioning
# ========================================
**.mobility.constraintAreaMinX = -3666m
**.mobility.constraintAreaMinY = -3784m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxX = 3666m
**.mobility.constraintAreaMaxY = 3784m
**.mobility.constraintAreaMaxZ = 100m

# ========================================
# 5G NR CARRIER CONFIGURATION
# ========================================
**.carrierAggregation.numComponentCarriers = 1
**.componentCarrier[0].numerologyIndex = 3
**.componentCarrier[0].carrierFrequency = 4GHz
**.componentCarrier[0].numRbs = 66

# ========================================
# CORE NETWORK - 5G Standalone Architecture
# ========================================
# UPF Configuration (replaces PGW/SGW)
**.upf.numGNodeBs = 1
**.iUpf.numGNodeBs = 19

# Router configuration
**.router.ipv4.routingTable.forwardMulticast = false

